[workspace]
resolver = "3"
members = ["shared", "wolf_tno"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
# A game pack carries its crate's `repository` as where it comes from (`monaka_contract::pack::About`).
repository = "https://github.com/optimumbox/wolfenstein-games-vr"

# Monaka's crates, from the checkouts two folders up: `monaka_sdk` and `monaka_vr`, with this
# repository in `monaka_adapters/wolfenstein-games-vr` beside them. Edits to all build together.
[workspace.dependencies]
monaka_body = { path = "../../monaka_sdk/crates/body" }
monaka_channel = { path = "../../monaka_sdk/crates/channel" }
monaka_contract = { path = "../../monaka_sdk/crates/contract" }
monaka_core = { path = "../../monaka_sdk/crates/core" }
monaka_dlss11 = { path = "../../monaka_sdk/crates/dlss11" }
monaka_hook = { path = "../../monaka_sdk/crates/hook" }
monaka_launch = { path = "../../monaka_vr/crates/launch" }
monaka_pad = { path = "../../monaka_sdk/crates/pad" }
monaka_producer = { path = "../../monaka_sdk/crates/producer" }
monaka_stereo = { path = "../../monaka_sdk/crates/stereo" }
monaka_warp = { path = "../../monaka_sdk/crates/warp" }
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Code that runs inside a game must never unwind into the game's frames.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Small edits rebuild in seconds (each crate recompiles only what changed).
incremental = true
